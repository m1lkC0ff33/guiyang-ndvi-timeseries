# ====================================================================
# Guiyang NDVI Time Series Analysis — 参数配置
# --------------------------------------------------------------------
# 此文件是 src/config.py 的可编辑补充：
#   - 路径与年份等"用户可调"参数在此处维护
#   - Landsat 物理常数、文件名规则等"代码常量"在 src/config.py 中维护
#   - 运行时由 src/config.py 的 load_params() 加载
# ====================================================================

# ----------------------------------------------------------------------
# 路径配置（相对项目根目录）
# ----------------------------------------------------------------------
paths:
  raw_dir: data/raw
  processed_dir: data/processed
  outputs_dir: outputs
  figures_dir: outputs/figures
  tables_dir: outputs/tables
  # 边界矢量文件（贵阳市行政区划）。优先级 geojson > shp。
  # 放置于 data/processed/ 下，命名建议：
  #   - guiyang_boundary.geojson  （推荐，来自阿里 DataV）
  #   - guiyang_boundary.shp
  # 文件缺失时 preprocess.py 会跳过裁剪步骤，但流程仍可继续。
  boundary_path: data/processed/guiyang_boundary.geojson

# ----------------------------------------------------------------------
# 时间范围
# ----------------------------------------------------------------------
time_range:
  start_year: 2015
  end_year: 2025

# ----------------------------------------------------------------------
# 数据筛选
#   每景的 cloud_cover 若超出阈值，会在元数据 CSV 中标注（不影响处理）
# ----------------------------------------------------------------------
filtering:
  cloud_cover_max: 20.0   # 与原始下载筛选条件一致

# ----------------------------------------------------------------------
# Landsat 波段命名
#   Landsat 8 / 9 Collection 2 Level-2 SR 中：
#     Band 4 = Red  (640-673 nm)
#     Band 5 = NIR  (850-879 nm)
# ----------------------------------------------------------------------
landsat:
  red_band_file: SR_B4
  nir_band_file: SR_B5
  mtl_suffix: MTL

# ----------------------------------------------------------------------
# 反射率缩放（Landsat Collection 2 Level-2 SR 默认值）
#   公式：SR = DN * mult + add
#   实际处理时会从每景 MTL 读取对应字段覆盖此默认值
# ----------------------------------------------------------------------
reflectance:
  mult: 2.75e-05
  add: -0.2
  fill_dn: 0
  valid_min: -0.2
  valid_max: 1.6

# ----------------------------------------------------------------------
# NDVI 有效范围与无效像元处理
# ----------------------------------------------------------------------
ndvi:
  valid_min: -1.0
  valid_max: 1.0
  # 分母 NIR+Red 小于此阈值时认为无植被信号，NDVI 置 NaN
  denominator_min: 0.0001

# ----------------------------------------------------------------------
# 输出 GeoTIFF 编码
# ----------------------------------------------------------------------
output:
  dtype: float32
  compress: deflate
  tiled: true
